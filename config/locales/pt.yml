  about:
    title: "Sobre Mim"
    header_subtitle: "Desenvolvedor Full Stack & Pesquisador em Ciência da Computação"
    meta_description: "Conheça mais sobre Marcos Hiarley, desenvolvedor full stack e pesquisador na UFPA."
    heading: "Quem sou eu"
    bio_p1_html: "Sou <strong>Marcos Hiarley</strong>, desenvolvedor Full Stack e pesquisador vinculado à <strong>Faculdade de Computação (FACOMP)</strong> da <strong>Universidade Federal do Pará (UFPA)</strong>. Combino rigor acadêmico e engenharia de software prática para criar aplicações web modernas, escaláveis e eficientes."
    bio_p2_html: "No desenvolvimento de software, atuo com ferramentas como <strong>Ruby on Rails</strong>, <strong>PostgreSQL</strong>, <strong>React</strong>, <strong>JavaScript</strong>, <strong>Java</strong> e <strong>Docker</strong>. Minha experiência abrange desde a modelagem de banco de dados e APIs RESTful até interfaces responsivas de alto desempenho."
    bio_p3_html: "Na área de pesquisa, dedico-me a estudos avançados em <strong>Computação de Alto Desempenho (HPC)</strong>, transmissão sem fio em altas frequências para redes <strong>5G e 6G</strong>, simulações em <strong>NS-3</strong> e Internet das Coisas (IoT)."
    download_cv_pt: "Baixar CV (PT)"
    download_cv_en: "Download CV (EN)"
    skills_tag: "Habilidades"
    skills_title: "Minhas Tecnologias & Competências"
    skills:
      rails_title: "Ruby on Rails"
      rails_desc: "Desenvolvimento backend, APIs RESTful escaláveis, arquitetura de software e bancos de dados relacionais."
      react_title: "React & JavaScript"
      react_desc: "Criação de interfaces web dinâmicas, componentes responsivos, ES6+, Stimulus.js e integração com APIs."
      java_title: "Java & Engenharia de Software"
      java_desc: "Programação orientada a objetos, estruturas de dados avançadas e desenvolvimento de sistemas."
      pg_title: "PostgreSQL"
      pg_desc: "Modelagem relacional, otimização de queries SQL, índices avançados e persistência de dados."
      networks_title: "Redes & Simulações (5G/6G)"
      networks_desc: "Pesquisa acadêmica, simulações em NS-3, protocolos de comunicação sem fio e IoT."
      docker_title: "Docker & DevOps"
      docker_desc: "Containerização de aplicações, ambientes isolados, versionamento com Git e GitHub."
    experience_tag: "Experiência"
    experience_title: "Minha Trajetória Profissional"
    experiences:
      evolutec:
        date: "jan de 2026 - jun de 2026"
        role: "Desenvolvedor Full Stack"
        company: "Evolutec Educação • Tempo integral"
        desc: "Implementação de soluções de back-end robustas utilizando Java e frameworks relacionados, proporcionando maior escalabilidade e facilidade de manutenção para as aplicações desenvolvidas."
      ufpa_health:
        date: "mai de 2024 - jan de 2026"
        role: "Membro de Equipe Científica"
        company: "Universidade Federal do Pará (UFPA)"
        desc_html: "Atuação no projeto <em>Machine Learning for Health Predictions</em>, focado no uso de Inteligência Artificial para apoiar o pré-diagnóstico de câncer do colo do útero. O trabalho envolveu o treinamento de um modelo baseado na arquitetura LeNet-5 para análise de exames e predição em saúde."
      ufpa_5g:
        date: "mai de 2023 - Presente"
        role: "Membro de Equipe Científica"
        company: "Universidade Federal do Pará (UFPA) • Estágio"
        desc_html: "Atuação no projeto <em>Transmissão Sem Fio em Altas Frequências para Redes 5G e 6G</em>, desenvolvendo simulações de cenários reais de redes móveis utilizando o simulador open source NS-3 integrado ao módulo mmWave 5G-LENA."
      sea_telecom:
        date: "mar de 2022 - nov de 2022"
        role: "Suporte Técnico"
        company: "Sea Telecom"
        desc: "Implementação de soluções de banco de dados SQL que aprimoraram a análise de dados, resultando em decisões mais informadas e melhor resposta a necessidades dos clientes."
      ifpa_dev:
        date: "ago de 2019 - dez de 2021"
        role: "Desenvolvedor para Android"
        company: "IFPA - Instituto Federal do Pará • Estágio"
        desc: "Atuação no desenvolvimento de aplicativos móveis nativos para a plataforma Android, abrangendo modelagem de banco de dados SQLite local, consumo de APIs e integração de rotinas móveis."
    education_tag: "Educação"
    education_title: "Formação Acadêmica"
    educations:
      ufpa:
        date: "set de 2021 - set de 2025"
        school: "Universidade Federal do Pará"
        degree: "Bacharelado em Engenharia de Computação"
        desc: "Formação focada em arquitetura de computadores, inteligência artificial, redes de computadores, computação de alto desempenho (HPC) e algoritmos."
      ifpa:
        date: "fev de 2018 - jul de 2020"
        school: "IFPA - Instituto Federal do Pará"
        degree: "Ensino Médio Profissionalizante (Pós-médio), Técnico em Informática"
        desc: "Formação técnica focada em desenvolvimento de software, modelagem de banco de dados relacionais (SQL), redes de computadores e suporte técnico."
    certifications_tag: "Conquistas"
