services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-portfolio_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portfolio} -d ${DB_NAME:-portfolio_production}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: hiarley/portfolio:latest
    restart: always
    expose:
      - "3000"
    depends_on:
      - db
    volumes:
      - storage_data:/rails/storage
    environment:
      DATABASE_URL: "postgres://${DB_USER:-portfolio}:${DB_PASSWORD}@db:5432/${DB_NAME:-portfolio_production}"
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_LOG_TO_STDOUT: "true"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      APP_HOST: ${APP_HOST}
      SMTP_DOMAIN: ${SMTP_DOMAIN}

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from marcoshiarley.insilico.cloud --to web:3000
    depends_on:
      - web

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
