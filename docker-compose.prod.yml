services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-portfolio_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portfolio} -d ${DB_NAME:-portfolio_production}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  web:
    image: hiarley/portfolio:latest
    restart: always
    networks:
      - default
      - insilico
    volumes:
      - storage_data:/rails/storage
    environment:
      DATABASE_URL: "postgres://${DB_USER:-portfolio}:${DB_PASSWORD}@db:5432/${DB_NAME:-portfolio_production}"
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_LOG_TO_STDOUT: "true"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      APP_HOST: ${APP_HOST}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portfolio-web.rule=Host(`marcoshiarley.insilico.cloud`)"
        - "traefik.http.routers.portfolio-web.entrypoints=websecure"
        - "traefik.http.routers.portfolio-web.tls=true"
        - "traefik.http.routers.portfolio-web.tls.certresolver=letsencrypt"
        - "traefik.http.services.portfolio-web.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  storage_data:

networks:
  default:
  insilico:
    external: true
    name: insilico
