  about:
    title: "About Me"
    header_subtitle: "Full Stack Developer & Computer Science Researcher"
    meta_description: "Learn more about Marcos Hiarley, full stack developer and researcher at UFPA."
    heading: "Who I am"
    bio_p1_html: "I am <strong>Marcos Hiarley</strong>, a Full Stack Developer and researcher affiliated with the <strong>Faculty of Computing (FACOMP)</strong> at the <strong>Federal University of Pará (UFPA)</strong>. I combine academic rigor and practical software engineering to build modern, scalable, and efficient web applications."
    bio_p2_html: "In software engineering, I work with tools such as <strong>Ruby on Rails</strong>, <strong>PostgreSQL</strong>, <strong>React</strong>, <strong>JavaScript</strong>, <strong>Java</strong>, and <strong>Docker</strong>. My experience spans from database modeling and RESTful APIs to high-performance responsive user interfaces."
    bio_p3_html: "In academic research, I focus on advanced studies in <strong>High Performance Computing (HPC)</strong>, high-frequency wireless transmission for <strong>5G and 6G</strong> networks, <strong>NS-3</strong> simulations, and the Internet of Things (IoT)."
    download_cv_pt: "Download CV (PT)"
    download_cv_en: "Download CV (EN)"
    skills_tag: "Skills"
    skills_title: "My Technologies & Competencies"
    skills:
      rails_title: "Ruby on Rails"
      rails_desc: "Backend development, scalable RESTful APIs, software architecture, and relational databases."
      react_title: "React & JavaScript"
      react_desc: "Dynamic web interfaces, responsive UI components, ES6+, Stimulus.js, and API integration."
      java_title: "Java & Software Engineering"
      java_desc: "Object-oriented programming, advanced data structures, and enterprise system development."
      pg_title: "PostgreSQL"
      pg_desc: "Relational modeling, SQL query optimization, advanced indexing, and data persistence."
      networks_title: "Networks & Simulations (5G/6G)"
      networks_desc: "Academic research, NS-3 simulations, wireless communication protocols, and IoT."
      docker_title: "Docker & DevOps"
      docker_desc: "Application containerization, isolated environments, version control with Git and GitHub."
    experience_tag: "Experience"
    experience_title: "My Professional Journey"
    experiences:
      evolutec:
        date: "Jan 2026 - Jun 2026"
        role: "Full Stack Developer"
        company: "Evolutec Educação • Full-time"
        desc: "Implementation of robust back-end solutions using Java and related frameworks, providing greater scalability and maintainability for developed applications."
      ufpa_health:
        date: "May 2024 - Jan 2026"
        role: "Scientific Team Member"
        company: "Federal University of Pará (UFPA)"
        desc_html: "Work on the <em>Machine Learning for Health Predictions</em> project, focused on using Artificial Intelligence to support cervical cancer pre-diagnosis. The project involved training a model based on the LeNet-5 architecture for examination analysis and healthcare prediction."
      ufpa_5g:
        date: "May 2023 - Present"
        role: "Scientific Team Member"
        company: "Federal University of Pará (UFPA) • Internship"
        desc_html: "Work on the <em>Wireless Transmission in High Frequencies for 5G and 6G Networks</em> project, developing real-world mobile network scenario simulations using the open-source NS-3 simulator integrated with the mmWave 5G-LENA module."
      sea_telecom:
        date: "Mar 2022 - Nov 2022"
        role: "Technical Support"
        company: "Sea Telecom"
        desc: "Implementation of SQL database solutions that improved data analytics, resulting in more informed decisions and better response to customer needs."
      ifpa_dev:
        date: "Aug 2019 - Dec 2021"
        role: "Android Developer"
        company: "IFPA - Federal Institute of Pará • Internship"
        desc: "Development of native mobile applications for the Android platform, covering local SQLite database modeling, REST API consumption, and mobile workflow integration."
